<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Leakling Overlay</title>
    <link rel="stylesheet" href="./in-game.css" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app" hidden>
      <!-- Popup Pill v2 -->
      <div id="pill">
        <!-- Pulse dot -->
        <span class="pulse-dot" aria-hidden="true">
          <span class="pulse-ring"></span>
          <span class="pulse-core"></span>
        </span>

        <!-- Cause label -->
        <span id="cause-label">Crosshair</span>

        <!-- Dismiss -->
        <button id="dismiss-btn" class="dismiss-btn" aria-label="Dismiss">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
            <path d="M1.5 1.5L7.5 7.5M7.5 1.5L1.5 7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <script type="module" src="./in-game.js"></script>
  </body>
</html>
